{% load static %}
<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="auth-container d-flex align-items-center justify-content-center">
        <div class="card" style="width: 25rem;">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Kayıt Ol</h2>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|lower }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                    <div class="form-floating mb-3">
                        <input 
                            type="{{ field.field.widget.input_type }}" 
                            name="{{ field.name }}" 
                            id="{{ field.id_for_label }}" 
                            class="form-control {% if field.errors %}is-invalid{% endif %}" 
                            placeholder="{{ field.label }}"
                            required>
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {% if field.errors %}
                            <div class="invalid-feedback">
                                {{ field.errors.as_text }}
                            </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary mt-3">Kayıt Ol</button>
                    </div>
                </form>
                <p class="text-center mt-4">Zaten bir hesabın var mı? <a href="{% url 'login' %}">Giriş Yap</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
